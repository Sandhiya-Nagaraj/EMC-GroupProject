<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Container Card -->
    <img src="./my-Course-Images/EMC_logo[1].jpg.jpeg" alt="Error Makes Clever Logo" class="absolute top-4 left-4 w-16 h-16 rounded-full shadow-lg object-cover" >
  <div class="bg-white rounded-3xl shadow-xl overflow-hidden max-w-4xl w-full flex flex-col md:flex-row">
    
    <!-- Left Section: Form -->
    <div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center">
      <h2 class="text-3xl font-semibold text-center text-gray-800 mb-8">Sign In</h2>

      <form id="loginForm" class="space-y-5" onsubmit="event.preventDefault();">
        <!-- Email Field -->
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            <span class="text-red-500">*</span> Email
          </label>
          <input 
            type="email" 
            placeholder="Enter Email" 
            required 
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition"
          />
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            <span class="text-red-500">*</span> Password
          </label>
          <div class="relative">
            <input 
              id="passwordInput"
              type="password" 
              placeholder="Enter Password" 
              required 
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm pr-10 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition"
            />
            <button 
              type="button" 
              id="togglePassword" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none"
            >
              <!-- Eye Slash Icon -->
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.027 10.027 0 013.68-.863c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-1.745-1.745a3.5 3.5 0 11-4.95-4.95" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Utility Links -->
        <div class="flex justify-between items-center text-xs sm:text-sm text-gray-500 pt-1">
          <a href="#" class="hover:underline">Forgot Password?</a>
          <a href="#" class="text-sky-500 hover:underline font-medium">Use OTP instead</a>
        </div>

        <!-- Submit Button -->
         <button 
          type="submit" 
          class="w-full bg-sky-500 hover:bg-sky-600 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow">
         <a href="./home.html"> Sign In </a> 
        </button> 

        <!-- Register Link -->
        <div class="text-center text-xs sm:text-sm text-gray-500 pt-1">
          Don't have an account? 
          <a href="./index.html" class="text-sky-500 font-medium hover:underline">Create Now</a>
        </div>

        <!-- Google Sign-In -->
        <button 
          type="button" 
          class="w-full flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-2.5 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Continue with Google
        </button>
      </form>
    </div>

    <!-- Right Section: Testimonial Side Panel -->
    <div class="hidden md:flex w-1/2 bg-sky-500 p-8 items-center justify-center">
      <div class="bg-sky-400/30 backdrop-blur-md rounded-2xl p-8 max-w-xs text-center border border-white/20 shadow-lg text-white">
        <p class="text-lg font-medium leading-relaxed mb-6">
          "The MERN course at EMC exceeded my expectations in every way."
        </p>
        <div class="flex flex-col items-center gap-2">
          <img 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" 
            alt="Agnel D." 
            class="w-12 h-12 rounded-full border-2 border-white object-cover shadow-sm"
          />
          <span class="font-medium text-sm text-sky-100">Agnel D.</span>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript for Password Toggle -->
  <script>
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

      // Toggle Eye Icon SVG
      if (isPassword) {
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
      } else {
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.027 10.027 0 013.68-.863c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-1.745-1.745a3.5 3.5 0 11-4.95-4.95" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
        `;
      }
    });
  </script>
</body>
</html>
